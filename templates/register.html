{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper" style="max-width: 620px;">
  <div class="card">
    <div class="card-header" style="justify-content: center; flex-direction: column; text-align: center; border-bottom: none; margin-bottom: 0.5rem;">
      <h2 style="font-size: 1.5rem; font-weight: 800;">Student Registration</h2>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.25rem;">
        Create your fresher candidate profile to unlock transparent job matching
      </p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-row">
        <div class="form-group">
          <label for="full_name" class="form-label">Full Name <span class="req">*</span></label>
          <input 
            type="text" 
            id="full_name" 
            name="full_name" 
            class="form-control" 
            placeholder="e.g. Dhammadip Shirsath"
            value="{{ form_data.get('full_name', '') if form_data else '' }}" 
            required 
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address <span class="req">*</span></label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="e.g. student@college.edu"
            value="{{ form_data.get('email', '') if form_data else '' }}" 
            required
          >
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password" class="form-label">Password <span class="req">*</span></label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="Minimum 6 characters" 
            required
          >
          <div class="form-text">Must be at least 6 characters</div>
        </div>

        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm Password <span class="req">*</span></label>
          <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password" 
            class="form-control" 
            placeholder="Re-type password" 
            required
          >
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="degree" class="form-label">Degree / Qualification</label>
          <select id="degree" name="degree" class="form-control">
            <option value="MCA (Master of Computer Application)">MCA (Master of Computer Application)</option>
            <option value="BCA (Bachelor of Computer Application)">BCA (Bachelor of Computer Application)</option>
            <option value="B.Tech / B.E. (Computer Science)">B.Tech / B.E. (Computer Science)</option>
            <option value="B.Tech / B.E. (Information Technology)">B.Tech / B.E. (Information Technology)</option>
            <option value="B.Sc (Computer Science / IT)">B.Sc (Computer Science / IT)</option>
            <option value="M.Sc (Computer Science / IT)">M.Sc (Computer Science / IT)</option>
            <option value="Other Technical Degree">Other Technical Degree</option>
          </select>
        </div>

        <div class="form-group">
          <label for="college" class="form-label">College / Institute Name</label>
          <input 
            type="text" 
            id="college" 
            name="college" 
            class="form-control" 
            placeholder="e.g. Saket Gyanpeeth College"
            value="{{ form_data.get('college', '') if form_data else '' }}"
          >
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="target_role" class="form-label">Target Fresher Role</label>
          <select id="target_role" name="target_role" class="form-control">
            <option value="Junior Python / Backend Developer">Junior Python / Backend Developer</option>
            <option value="Frontend Web Developer Trainee">Frontend Web Developer Trainee</option>
            <option value="Associate Software Engineer">Associate Software Engineer</option>
            <option value="Junior Data Analyst">Junior Data Analyst</option>
            <option value="Trainee QA &amp; Test Automation">Trainee QA &amp; Test Automation</option>
            <option value="Cloud &amp; DevOps Support Associate">Cloud &amp; DevOps Support Associate</option>
            <option value="Full Stack Developer (Fresher)">Full Stack Developer (Fresher)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="skills" class="form-label">Technical Skills (Comma separated)</label>
          <input 
            type="text" 
            id="skills" 
            name="skills" 
            class="form-control" 
            placeholder="e.g. Python, Flask, HTML, CSS, JavaScript, SQL"
            value="{{ form_data.get('skills', '') if form_data else '' }}"
          >
          <div class="form-text">You can add and refine skills later in your profile.</div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
        Complete Registration &rarr;
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
      Already have an account? 
      <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">
        Sign In here
      </a>
    </div>
  </div>
</div>
{% endblock %}
